{% extends "auth/_card.html" %}
{% from "_form.html" import field %}
{% block title %}Forgot password - ChainBid{% endblock %}
{% block heading %}Reset your password{% endblock %}
{% block form %}
<form method="post" novalidate>
  {{ form.hidden_tag() }}
  {{ field(form.email) }}
  <button class="btn btn-primary w-100" type="submit">Send reset link</button>
</form>
{% endblock %}
