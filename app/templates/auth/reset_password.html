{% extends "auth/_card.html" %}
{% from "_form.html" import field %}
{% block title %}Set new password - ChainBid{% endblock %}
{% block heading %}Choose a new password{% endblock %}
{% block form %}
<form method="post" novalidate>
  {{ form.hidden_tag() }}
  {{ field(form.password) }}
  {{ field(form.confirm) }}
  <button class="btn btn-primary w-100" type="submit">Update password</button>
</form>
{% endblock %}
