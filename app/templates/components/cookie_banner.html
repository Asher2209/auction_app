<div id="cookie-banner" class="cookie-banner">
  <div class="container">
    <div class="cookie-banner-content">
      <div class="cookie-banner-text">
        <h5>Cookie Consent</h5>
        <p>We use cookies to improve your experience on ChainBid. Some cookies are essential for the platform to function, while others help us understand how you use our services and deliver personalized content.</p>
        <p class="small mb-0"><a href="{{ url_for('main.cookie_policy') }}">Learn more about our cookies</a></p>
      </div>
      <div class="cookie-banner-actions">
        <button id="cookie-reject" class="btn btn-sm btn-outline-secondary">Reject All</button>
        <button id="cookie-preferences" class="btn btn-sm btn-outline-primary">Preferences</button>
        <button id="cookie-accept" class="btn btn-sm btn-primary">Accept All</button>
      </div>
    </div>
  </div>
</div>

<!-- Cookie Preferences Modal -->
<div id="cookie-modal" class="modal fade" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Cookie Preferences</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="cookie-essential" checked disabled>
          <label class="form-check-label" for="cookie-essential">
            <strong>Essential Cookies</strong>
            <div class="small text-muted">Required for the platform to function. Cannot be disabled.</div>
          </label>
        </div>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="cookie-preferences">
          <label class="form-check-label" for="cookie-preferences">
            <strong>Preference Cookies</strong>
            <div class="small text-muted">Remember your settings and preferences.</div>
          </label>
        </div>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="cookie-analytics">
          <label class="form-check-label" for="cookie-analytics">
            <strong>Analytics Cookies</strong>
            <div class="small text-muted">Help us understand how you use ChainBid.</div>
          </label>
        </div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="cookie-marketing">
          <label class="form-check-label" for="cookie-marketing">
            <strong>Marketing Cookies</strong>
            <div class="small text-muted">Support our marketing and promotional efforts.</div>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="cookie-save">Save Preferences</button>
      </div>
    </div>
  </div>
</div>
