{% macro field(f, type=None) %}
<div class="mb-3">
  {{ f.label(class="form-label") }}
  {% set cls = "form-select" if f.type == "SelectField" else "form-control" %}
  {{ f(class=cls ~ (" is-invalid" if f.errors else ""), **kwargs) }}
  {% for e in f.errors %}<div class="invalid-feedback">{{ e }}</div>{% endfor %}
</div>
{% endmacro %}
